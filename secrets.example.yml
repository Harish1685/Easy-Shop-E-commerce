# Template only - DO NOT put real values in this file.
# It lives at the repo root (outside kubernetes/) on purpose: ArgoCD applies
# every YAML inside kubernetes/, and a synced template would overwrite the
# real Secret with these placeholders.
#
# Preferred: create the Secret directly with kubectl (see README Step 3.4).
# Alternative: cp secrets.example.yml secrets.yml   (secrets.yml is gitignored)
#              then fill in real values and run: kubectl apply -f secrets.yml
apiVersion: v1
kind: Secret
metadata:
  name: easyshop-secrets
  namespace: easyshop

type: Opaque

stringData:
  NEXTAUTH_SECRET: "<YOUR_NEXTAUTH_SECRET>"
  JWT_SECRET: "<YOUR_JWT_SECRET>"
