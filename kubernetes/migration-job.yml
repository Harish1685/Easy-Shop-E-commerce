apiVersion: batch/v1
kind: Job

metadata:
  name: db-migration
  namespace: easyshop
  annotations:
    # Jobs are immutable in Kubernetes - ArgoCD can't update this in place.
    # These hooks make ArgoCD delete the old Job and run a fresh one on every sync.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation

spec:
  template:
    spec:
      containers:
      - name: migration
        image: harishkumar1/easyshop-migration:1

        imagePullPolicy: Always

        envFrom:
          - configMapRef:
              name: easyshop-config
          - secretRef:
              name: easyshop-secrets

      restartPolicy: OnFailure